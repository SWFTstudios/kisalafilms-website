<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Your vinyl wrap project is paid. Elombe will confirm the appointment and order film.">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <!-- SEO: generated by scripts/build-seo.py -->
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Kisala Films">
  <meta property="og:description" content="Your vinyl wrap project is paid. Elombe will confirm the appointment and order film.">
  <meta property="og:title" content="Project ordered — Kisala Films">
  <meta property="og:url" content="https://kisalafilms-website.elombe.workers.dev/project-thanks">
  <meta property="og:image" content="https://kisalafilms-website.elombe.workers.dev/images/brand/kisala-films-logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Project ordered — Kisala Films">
  <meta name="twitter:image" content="https://kisalafilms-website.elombe.workers.dev/images/brand/kisala-films-logo.png">
  <meta name="twitter:description" content="Your vinyl wrap project is paid. Elombe will confirm the appointment and order film.">
  <link rel="stylesheet" href="/css/carsy.css">
  <script src="/js/kisala-config.js"></script>
  <script src="/js/analytics.js"></script>
</head>
<body class="carsy">

  <header class="site-header">
    <div class="container header-bar">
      <a class="logo" href="/"><img src="/images/brand/kisala-films-logo.png" alt="Kisala Films" width="1421" height="745"></a>
      <nav class="nav-desktop" aria-label="Primary">
        <a href="/vinyl-catalog">Vinyl catalog</a>
        <a href="/project">Start a project</a>
        <a href="/gallery">Gallery</a>
        <a href="/contact">Contact</a>
        <a class="btn btn-primary nav-cta" href="/vinyl-catalog">Browse films</a>
      </nav>
      <button class="nav-toggle" type="button" data-nav-toggle aria-label="Open menu" aria-expanded="false">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Mission complete</p>
        <h1>Project ordered</h1>
        <p class="p-lg" data-thanks-lede>Confirming your payment…</p>
        <div class="kf-quote-board" data-thanks-order style="max-width:520px;margin-top:24px"></div>
        <div class="btn-row" style="margin-top:28px">
          <a class="btn btn-primary" href="/vinyl-catalog">Back to catalog</a>
          <a class="btn btn-ghost" href="/contact">Contact the garage</a>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/config-apply.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get("session_id") || "";
      const orderId = params.get("order_id") || "";
      const lede = document.querySelector("[data-thanks-lede]");
      const board = document.querySelector("[data-thanks-order]");
      const money = (n) =>
        "$" + Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 0 });

      window.KisalaTrack?.("project_purchase", { label: orderId || sessionId });

      const q = new URLSearchParams();
      if (sessionId) q.set("session_id", sessionId);
      if (orderId) q.set("order_id", orderId);

      fetch("/api/checkout/session?" + q.toString())
        .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
        .then(({ ok, d }) => {
          const order = d.order;
          if (!ok || !order) {
            if (lede) lede.textContent = "Payment received — Elombe will email you to book the slot.";
            if (board) board.innerHTML = "<p class=\"meta\">Order reference: " + (orderId || sessionId || "—") + "</p>";
            return;
          }
          if (lede) {
            lede.textContent =
              order.status === "paid"
                ? "You’re booked in the queue. Vinyl will be ordered and Elombe will confirm the appointment."
                : "Payment started — we’ll email you when it’s confirmed.";
          }
          if (board) {
            board.innerHTML =
              "<ul class=\"kf-quote-lines\" style=\"list-style:none;padding:0\">" +
              "<li style=\"display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12)\"><span>Order</span><strong>" +
              order.id +
              "</strong></li>" +
              "<li style=\"display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12)\"><span>Film</span><strong>" +
              (order.filmName || order.filmHandle || "—") +
              "</strong></li>" +
              "<li style=\"display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12)\"><span>Total</span><strong>" +
              money(order.totalUsd) +
              "</strong></li></ul>";
          }
        })
        .catch(() => {
          if (lede) lede.textContent = "Payment received — Elombe will follow up by email.";
        });
    })();
  </script>
</body>
</html>
