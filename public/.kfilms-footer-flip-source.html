<script>
(function () {
  if (window.__kfilmsSiteHeaderReady) return;
  window.__kfilmsSiteHeaderReady = true;
  var THEME_KEY = 'kfilms-theme';
  var FORMAT_KEY = 'kfilms-time-format';
  function getStoredTheme() {
    try {
      var t = localStorage.getItem(THEME_KEY);
      if (t === 'day' || t === 'night') return t;
    } catch (e) {}
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'day';
    return 'night';
  }
  function applyTheme(theme) {
    document.documentElement.classList.remove('theme-day', 'theme-night');
    document.documentElement.classList.add(theme === 'day' ? 'theme-day' : 'theme-night');
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    var btn = document.querySelector('.site-menu-theme');
    if (btn) btn.textContent = theme === 'day' ? 'Switch to Night' : 'Switch to Day';
  }
  function getFormat() {
    try {
      var f = localStorage.getItem(FORMAT_KEY);
      if (f === '12' || f === '24') return f;
    } catch (e) {}
    return '12';
  }
  function setFormat(fmt) {
    try { localStorage.setItem(FORMAT_KEY, fmt); } catch (e) {}
  }
  function formatTime(date, fmt) {
    var h = date.getHours();
    var m = date.getMinutes();
    var s = date.getSeconds();
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    if (fmt === '24') return pad(h) + ':' + pad(m) + ':' + pad(s);
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12;
    if (h12 === 0) h12 = 12;
    return h12 + ':' + pad(m) + ':' + pad(s) + ' ' + ampm;
  }
  function ensureOverlay() {
    var overlay = document.querySelector('.site-menu-overlay');
    if (overlay) return overlay;
    overlay = document.createElement('div');
    overlay.className = 'site-menu-overlay';
    overlay.setAttribute('aria-hidden', 'true');
    overlay.innerHTML =
      '<nav aria-label="Site">' +
        '<ul class="site-menu-nav">' +
          '<li><a href="/">Home</a></li>' +
          '<li><a href="/theatre">Theatre</a></li>' +
          '<li><a href="/styleguide">Styleguide</a></li>' +
          '<li><a href="/about">About</a></li>' +
        '</ul>' +
      '</nav>' +
      '<button type="button" class="site-menu-theme">Switch to Day</button>';
    document.body.appendChild(overlay);
    return overlay;
  }
  function setMenuOpen(open) {
    var header = document.querySelector('.site-header');
    var overlay = ensureOverlay();
    if (header) header.classList.toggle('is-open', open);
    overlay.classList.toggle('is-open', open);
    overlay.setAttribute('aria-hidden', open ? 'false' : 'true');
    document.body.classList.toggle('menu-open', open);
    var menuBtn = document.querySelector('.site-header_menu');
    if (menuBtn) menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  function initHeader(header) {
    if (header.getAttribute('data-site-header-ready')) return;
    header.setAttribute('data-site-header-ready', '1');
    var clock = header.querySelector('.site-clock');
    var menuBtn = header.querySelector('.site-header_menu');
    var overlay = ensureOverlay();
    var fmt = getFormat();
    function tick() {
      if (clock) {
        var textNode = clock.childNodes[0];
        var label = formatTime(new Date(), fmt);
        if (textNode && textNode.nodeType === 3) textNode.textContent = label;
        else clock.textContent = label;
      }
    }
    tick();
    setInterval(tick, 1000);
    if (clock) {
      clock.setAttribute('aria-label', 'Toggle 12 or 24 hour time');
      clock.setAttribute('role', 'button');
      clock.addEventListener('click', function (e) {
        e.preventDefault();
        fmt = fmt === '12' ? '24' : '12';
        setFormat(fmt);
        tick();
      });
    }
    if (menuBtn) {
      menuBtn.setAttribute('aria-expanded', 'false');
      menuBtn.setAttribute('aria-controls', 'site-menu-overlay');
      menuBtn.setAttribute('aria-label', 'Open menu');
      menuBtn.setAttribute('role', 'button');
      menuBtn.addEventListener('click', function (e) {
        e.preventDefault();
        var open = !document.body.classList.contains('menu-open');
        setMenuOpen(open);
        menuBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      });
    }
    overlay.id = 'site-menu-overlay';
    var themeBtn = overlay.querySelector('.site-menu-theme');
    if (themeBtn && !themeBtn.getAttribute('data-bound')) {
      themeBtn.setAttribute('data-bound', '1');
      themeBtn.addEventListener('click', function () {
        var next = document.documentElement.classList.contains('theme-day') ? 'night' : 'day';
        applyTheme(next);
      });
    }
    overlay.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function () { setMenuOpen(false); });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') setMenuOpen(false);
    });
  }
  applyTheme(getStoredTheme());
  function boot() {
    document.querySelectorAll('.site-header').forEach(initHeader);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@barba/core@2.9.7/dist/barba.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>

<script>
(function () {
  if (window.__kfilmsHomeScrollReady) return;
  window.__kfilmsHomeScrollReady = true;

  var homeMm = null;
  var marqueeTween = null;
  var marqueeBoostHandler = null;

  function ensurePlugins() {
    if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return false;
    gsap.registerPlugin(ScrollTrigger);
    return true;
  }

  function ensureLenis() {
    if (!ensurePlugins()) return null;
    if (typeof Lenis === 'undefined') return null;
    if (!window.lenis) {
      var lenis = new Lenis({ lerp: 0.1, smoothWheel: true });
      lenis.on('scroll', ScrollTrigger.update);
      gsap.ticker.add(function (time) {
        lenis.raf(time * 1000);
      });
      gsap.ticker.lagSmoothing(0);
      window.lenis = lenis;
    }
    return window.lenis;
  }

  function scopeRoot(root) {
    if (root && root.querySelector) return root;
    return document.querySelector('[data-barba="container"]') || document;
  }

  function hasHomeMarkers(scope) {
    return !!(
      scope.querySelector('.horizontal') ||
      scope.querySelector('.marquee-track') ||
      scope.querySelector('.theatre-pin') ||
      scope.querySelector('.about-intro-media') ||
      scope.querySelector('.theatre-list')
    );
  }

  window.kfilmsDestroyHome = function () {
    if (homeMm && homeMm.revert) {
      try { homeMm.revert(); } catch (e) {}
    }
    homeMm = null;
    if (marqueeTween) {
      try { marqueeTween.kill(); } catch (e) {}
      marqueeTween = null;
    }
    if (marqueeBoostHandler && window.lenis && typeof window.lenis.off === 'function') {
      try { window.lenis.off('scroll', marqueeBoostHandler); } catch (e) {}
      marqueeBoostHandler = null;
    }
    if (typeof ScrollTrigger === 'undefined') return;
    ScrollTrigger.getAll().forEach(function (st) {
      var t = st.trigger;
      if (!t) {
        st.kill();
        return;
      }
      if (
        t.closest &&
        (t.closest('.horizontal') ||
          t.closest('.about-intro-media') ||
          t.closest('.theatre-pin') ||
          t.closest('.theatre-list') ||
          t.closest('.marquee-section'))
      ) {
        st.kill();
      }
    });
  };

  function initAboutWipe(scope) {
    var media = scope.querySelector('.about-intro-media');
    var image = scope.querySelector('.about-image-placeholder');
    if (!media || !image) return;
    gsap.fromTo(
      image,
      { clipPath: 'inset(0 100% 0 0)' },
      {
        clipPath: 'inset(0 0% 0 0)',
        ease: 'none',
        scrollTrigger: {
          trigger: media,
          start: 'top 80%',
          end: 'top 30%',
          scrub: true,
        },
      }
    );
  }

  function initMarquee(scope, lenis) {
    var track = scope.querySelector('.marquee-track');
    if (!track) return;

    if (!track.getAttribute('data-kf-marquee-ready')) {
      var originals = Array.prototype.slice.call(track.children);
      originals.forEach(function (child) {
        track.appendChild(child.cloneNode(true));
      });
      track.setAttribute('data-kf-marquee-ready', '1');
    }

    marqueeTween = gsap.to(track, {
      x: function () {
        return -track.scrollWidth / 2;
      },
      duration: 45,
      ease: 'none',
      repeat: -1,
    });

    var idleTimer;
    function boostFromVelocity(velocity) {
      var boost = Math.min(Math.abs(velocity) / 600, 3);
      var target = 1 + boost;
      gsap.to(marqueeTween, {
        timeScale: target,
        duration: 0.35,
        overwrite: true,
        ease: 'power2.out',
      });
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () {
        gsap.to(marqueeTween, {
          timeScale: 1,
          duration: 0.8,
          overwrite: true,
          ease: 'power2.out',
        });
      }, 120);
    }

    if (lenis) {
      marqueeBoostHandler = function (e) {
        boostFromVelocity(e.velocity || 0);
      };
      lenis.on('scroll', marqueeBoostHandler);
    } else {
      ScrollTrigger.create({
        onUpdate: function (self) {
          boostFromVelocity(self.getVelocity());
        },
      });
    }
  }

  function initTheatrePin(scope) {
    var pin = scope.querySelector('.theatre-pin');
    var reel = scope.querySelector('.theatre-reel');
    if (!pin || !reel) return;

    function getStartSize() {
      var vw = window.innerWidth;
      return vw < 768 ? vw * 0.55 : vw * 0.4;
    }

    gsap.fromTo(
      reel,
      {
        width: function () {
          return getStartSize();
        },
        height: function () {
          return getStartSize();
        },
        aspectRatio: '1 / 1',
      },
      {
        width: function () {
          return window.innerWidth;
        },
        height: function () {
          return window.innerHeight;
        },
        aspectRatio: 'auto',
        ease: 'none',
        scrollTrigger: {
          trigger: pin,
          start: 'top top',
          end: 'bottom bottom',
          scrub: true,
          invalidateOnRefresh: true,
        },
      }
    );
  }

  function initTheatreList(scope) {
    var depts = gsap.utils.toArray(scope.querySelectorAll('.theatre-dept'));
    if (!depts.length) return;

    var intro = scope.querySelector('.theatre-list-intro');
    if (intro) {
      gsap.from(intro.children, {
        opacity: 0,
        y: 24,
        duration: 0.8,
        stagger: 0.1,
        ease: 'power2.out',
        scrollTrigger: {
          trigger: intro,
          start: 'top 80%',
          toggleActions: 'play none none none',
        },
      });
    }

    depts.forEach(function (dept) {
      var line = dept.querySelector('.theatre-dept-line');
      var label = dept.querySelector('.theatre-dept-label');
      var links = dept.querySelector('.theatre-dept-links');
      var desc = dept.querySelector('.theatre-dept-desc');
      var media = dept.querySelector('.theatre-dept-media');

      if (line) {
        gsap.fromTo(
          line,
          { scaleX: 0 },
          {
            scaleX: 1,
            ease: 'power2.out',
            duration: 1,
            scrollTrigger: {
              trigger: dept,
              start: 'top 75%',
              toggleActions: 'play none none none',
            },
          }
        );
      }

      var fadeItems = [label, links, desc, media].filter(Boolean);
      if (fadeItems.length) {
        gsap.from(fadeItems, {
          opacity: 0,
          y: 28,
          duration: 0.75,
          stagger: 0.12,
          ease: 'power2.out',
          scrollTrigger: {
            trigger: dept,
            start: 'top 75%',
            toggleActions: 'play none none none',
          },
        });
      }
    });
  }

  function initHorizontal(scope) {
    homeMm = gsap.matchMedia();
    homeMm.add('(min-width: 769px)', function () {
      var horizontal = scope.querySelector('.horizontal');
      if (!horizontal) return;

      var horizontalContent = horizontal.querySelector('.horizontal_wrapper');
      if (!horizontalContent) return;

      var tl = gsap.timeline({
        defaults: { ease: 'none' },
        scrollTrigger: {
          trigger: horizontal,
          start: 'top top',
          end: function () {
            return '+=' + (horizontalContent.scrollWidth - window.innerWidth);
          },
          pin: true,
          scrub: 1,
          invalidateOnRefresh: true,
        },
      });

      tl.to(horizontalContent, {
        x: function () {
          return -(horizontalContent.scrollWidth - window.innerWidth);
        },
        ease: 'none',
      });

      var wallPieces = gsap.utils.toArray(scope.querySelectorAll('[class*="wall-piece-"]'));
      var pieceTriggers = [];

      wallPieces.forEach(function (piece) {
        var anim = gsap.fromTo(
          piece,
          { scale: 0.35 },
          {
            scale: 1,
            duration: 0.9,
            ease: 'power2.out',
            scrollTrigger: {
              trigger: piece,
              containerAnimation: tl,
              start: 'left 85%',
              toggleActions: 'play none none none',
            },
          }
        );
        if (anim.scrollTrigger) pieceTriggers.push(anim.scrollTrigger);
      });

      return function () {
        pieceTriggers.forEach(function (st) {
          st.kill();
        });
        if (tl.scrollTrigger) tl.scrollTrigger.kill();
        tl.kill();
        gsap.set(horizontalContent, { clearProps: 'x' });
        gsap.set(wallPieces, { clearProps: 'scale' });
      };
    });
  }

  window.kfilmsInitHome = function (root) {
    if (!ensurePlugins()) return;
    var scope = scopeRoot(root);
    if (!hasHomeMarkers(scope)) return;

    window.kfilmsDestroyHome();
    var lenis = ensureLenis();
    if (lenis && lenis.start) {
      try { lenis.start(); } catch (e) {}
    }

    initAboutWipe(scope);
    initMarquee(scope, lenis);
    initHorizontal(scope);
    initTheatrePin(scope);
    initTheatreList(scope);

    requestAnimationFrame(function () {
      if (typeof ScrollTrigger !== 'undefined') ScrollTrigger.refresh(true);
    });
  };

  function boot() {
    var container = document.querySelector('[data-barba-namespace="home"]') ||
      document.querySelector('[data-barba="container"]');
    if (container && hasHomeMarkers(container)) {
      window.kfilmsInitHome(container);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
<script>
(function () {
  var HASHES = ['video-cars', 'video-motorcycles', 'video-real-estate', 'video-weddings', 'video-training'];
  var FLIP_ID_KEY = 'kfilmsFlipId';
  var theatreInstances = [];

  function numberWithZero(num) {
    return num < 10 ? '0' + num : String(num);
  }

  function persistFlipId(id) {
    if (!id || HASHES.indexOf(id) === -1) return;
    window.__kfilmsFlipId = id;
    try { sessionStorage.setItem(FLIP_ID_KEY, id); } catch (e) {}
  }

  function readStoredFlipId() {
    try {
      var id = sessionStorage.getItem(FLIP_ID_KEY);
      if (id && HASHES.indexOf(id) !== -1) return id;
    } catch (e) {}
    return null;
  }

  function clearFlipId() {
    window.__kfilmsFlipId = null;
    try { sessionStorage.removeItem(FLIP_ID_KEY); } catch (e) {}
  }

  function destroyTheatre() {
    theatreInstances.forEach(function (sw) {
      try { if (sw && sw.destroy) sw.destroy(true, true); } catch (e) {}
    });
    theatreInstances = [];
  }

  window.kfilmsInitTheatre = function (root, hashOverride) {
    if (typeof Swiper === 'undefined' || typeof window.jQuery === 'undefined') return false;
    var $ = window.jQuery;
    var scope = root || document;
    var $galleries = $(scope).find('[data-theatre-gallery]');
    if (!$galleries.length && $(scope).is('[data-theatre-gallery]')) $galleries = $(scope);
    if (!$galleries.length) return false;
    destroyTheatre();
    $galleries.each(function () {
      var $root = $(this);
      var $bg = $root.find('[data-slider="bg"]');
      var $titles = $root.find('[data-slider="titles"]');
      var $thumbs = $root.find('[data-slider="thumbs"]');
      if (!$bg.length || !$titles.length || !$thumbs.length) return;
      $bg.addClass('swiper is-slider-bg');
      $titles.addClass('swiper is-slider-titles');
      $thumbs.addClass('swiper is-slider-thumbs');
      $root.find('[data-wrapper]').addClass('swiper-wrapper');
      $bg.find('[data-wrapper]').addClass('is-slider-bg');
      $titles.find('[data-wrapper]').addClass('is-slider-titles');
      $thumbs.find('[data-wrapper]').addClass('is-slider-thumbs');
      $root.find('[data-hash]').addClass('swiper-slide');
      $bg.find('[data-hash]').addClass('is-slider-bg');
      $titles.find('[data-hash]').addClass('is-slider-titles');
      $thumbs.find('[data-hash]').addClass('is-slider-thumbs');
      $root.find('[data-swiper-nav="prev"]').addClass('swiper-prev slider-gallery_button');
      $root.find('[data-swiper-nav="next"]').addClass('swiper-next slider-gallery_button');
      $bg.find('.slider-bg_img').addClass('visual');
      var total = $thumbs.find('[data-hash]').length;
      $root.find('.swiper-number-total').text(numberWithZero(total));
      var hash = (hashOverride || (window.location.hash || '').replace(/^#/, ''));
      var initial = HASHES.indexOf(hash);
      if (initial < 0) initial = 0;
      if (HASHES[initial]) persistFlipId(HASHES[initial]);
      var bgSwiper = new Swiper($bg[0], {
        slidesPerView: 1, speed: 400, effect: 'fade', allowTouchMove: false, initialSlide: initial
      });
      var thumbsSwiper = new Swiper($thumbs[0], {
        slidesPerView: 1, speed: 600, loop: true, loopedSlides: 5, slideToClickedSlide: true, initialSlide: initial
      });
      var textSwiper = new Swiper($titles[0], {
        slidesPerView: 'auto', speed: 600, loop: true, loopedSlides: 5, slideToClickedSlide: true,
        mousewheel: true, keyboard: true, centeredSlides: true, initialSlide: initial,
        slideActiveClass: 'is-active', slideDuplicateActiveClass: 'is-active',
        thumbs: { swiper: bgSwiper },
        navigation: {
          nextEl: $root.find('.swiper-next, [data-swiper-nav="next"]')[0],
          prevEl: $root.find('.swiper-prev, [data-swiper-nav="prev"]')[0]
        }
      });
      textSwiper.controller.control = thumbsSwiper;
      thumbsSwiper.controller.control = textSwiper;
      $root.find('.swiper-number-current').text(numberWithZero(initial + 1));
      textSwiper.on('slideChange', function (e) {
        $root.find('.swiper-number-current').text(numberWithZero(e.realIndex + 1));
        var h = HASHES[e.realIndex];
        if (h) {
          persistFlipId(h);
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, '', '#' + h);
          }
        }
      });
      $root.find('[data-swiper-nav]').on('click', function (e) { e.preventDefault(); });
      theatreInstances.push(bgSwiper, thumbsSwiper, textSwiper);
    });
    return true;
  };

  function bootTheatre() {
    var tries = 0;
    function attempt() {
      tries += 1;
      if (window.kfilmsInitTheatre(document)) return;
      if (tries < 40) setTimeout(attempt, 100);
    }
    attempt();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootTheatre);
  else bootTheatre();

  /* Play cursor */
  var cursorEl = null, cx = 0, cy = 0, tx = 0, ty = 0, raf = 0;
  function ensureCursor() {
    if (cursorEl) return cursorEl;
    cursorEl = document.createElement('div');
    cursorEl.className = 'kf-play-cursor';
    cursorEl.setAttribute('aria-hidden', 'true');
    cursorEl.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
    document.body.appendChild(cursorEl);
    return cursorEl;
  }
  function tickCursor() {
    cx += (tx - cx) * 0.18;
    cy += (ty - cy) * 0.18;
    if (cursorEl) { cursorEl.style.left = cx + 'px'; cursorEl.style.top = cy + 'px'; }
    raf = requestAnimationFrame(tickCursor);
  }
  function setCursorActive(on) {
    ensureCursor();
    cursorEl.classList.toggle('is-active', !!on);
  }
  function onMove(e) { tx = e.clientX; ty = e.clientY; }
  function bindPlayCursor(scope) {
    var root = scope || document;
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return;
    ensureCursor();
    if (!raf) raf = requestAnimationFrame(tickCursor);
    document.removeEventListener('mousemove', onMove);
    document.addEventListener('mousemove', onMove);
    root.querySelectorAll('.theatre-list .theatre-dept-media').forEach(function (el) {
      if (el.getAttribute('data-kf-cursor')) return;
      el.setAttribute('data-kf-cursor', '1');
      el.addEventListener('mouseenter', function () { setCursorActive(true); });
      el.addEventListener('mouseleave', function () { setCursorActive(false); });
    });
  }
  window.kfilmsBindPlayCursor = bindPlayCursor;

  function prepareVisuals(scope) {
    var root = scope || document;
    root.querySelectorAll('.theatre-dept-img').forEach(function (img) {
      img.classList.add('visual');
    });
    root.querySelectorAll('.slider-bg_img').forEach(function (img) {
      img.classList.add('visual');
    });
  }

  function resolveTheatreId(trigger) {
    if (window.__kfilmsFlipId) return window.__kfilmsFlipId;
    if (!trigger || trigger === 'back' || trigger === 'popstate' || trigger === 'barba') return null;
    var el = trigger;
    if (el.closest) {
      if (!el.closest('.theatre-list')) return null;
      var media = el.closest('.theatre-list [data-theatre-id]') || el.closest('.theatre-list .theatre-dept-media');
      if (media) return media.getAttribute('data-theatre-id') || null;
      var dept = el.closest('.theatre-list .theatre-dept');
      if (dept) {
        var m = dept.querySelector('[data-theatre-id]');
        if (m) return m.getAttribute('data-theatre-id') || null;
      }
    }
    var href = el.getAttribute && el.getAttribute('href');
    if (href && el.closest && el.closest('.theatre-list')) {
      var m2 = href.match(/#(video-[\w-]+)/);
      if (m2) return m2[1];
    }
    return null;
  }

  function resolveLeavingTheatreId(data) {
    var hash = '';
    if (data && data.current && data.current.url && data.current.url.hash) {
      hash = String(data.current.url.hash).replace(/^#/, '');
    }
    if (!hash && window.location && window.location.hash) {
      hash = String(window.location.hash).replace(/^#/, '');
    }
    if (hash && HASHES.indexOf(hash) !== -1) return hash;
    if (window.__kfilmsFlipId && HASHES.indexOf(window.__kfilmsFlipId) !== -1) {
      return window.__kfilmsFlipId;
    }
    return readStoredFlipId();
  }

  function markActive(id) {
    document.querySelectorAll('.active-flip-item').forEach(function (el) {
      el.classList.remove('active-flip-item');
    });
    if (!id) return null;
    var el = document.querySelector('.theatre-list [data-theatre-id="' + id + '"]');
    if (el) el.classList.add('active-flip-item');
    return el;
  }

  function bindFlipPointer(scope) {
    var root = scope || document;
    var list = root.querySelectorAll ? (root.matches && root.matches('.theatre-list') ? [root] : root.querySelectorAll('.theatre-list')) : [];
    if (!list.length && root.querySelectorAll) list = root.querySelectorAll('.theatre-section .theatre-list');
    Array.prototype.forEach.call(list, function (listRoot) {
      listRoot.querySelectorAll('.theatre-dept-media, .theatre-dept-link, a[href*="#video-"]').forEach(function (el) {
        if (el.getAttribute('data-kf-flip')) return;
        el.setAttribute('data-kf-flip', '1');
        el.addEventListener('pointerdown', function () {
          var id = el.getAttribute('data-theatre-id');
          if (!id) {
            var href = el.getAttribute('href') || '';
            var m = href.match(/#(video-[\w-]+)/);
            if (m) id = m[1];
            if (!id) {
              var dept = el.closest('.theatre-dept');
              var media = dept && dept.querySelector('[data-theatre-id]');
              if (media) id = media.getAttribute('data-theatre-id');
            }
          }
          if (id) {
            window.__kfilmsFlipId = id;
            markActive(id);
          }
        });
      });
    });
  }

  function flipDom($, outgoing, incoming) {
    if (!outgoing || !outgoing.length || !incoming || !incoming.length) return null;
    var $visual = outgoing.find('.visual').first();
    if (!$visual.length) return null;
    var state = Flip.getState($visual);
    incoming.find('.visual').remove();
    $visual.appendTo(incoming);
    return Flip.from(state, { duration: 0.55, ease: 'power1.inOut' });
  }

  function resetWebflow(data) {
    try {
      var parser = new DOMParser();
      var dom = parser.parseFromString(data.next.html, 'text/html');
      var pageId = dom.documentElement.getAttribute('data-wf-page');
      if (pageId) document.documentElement.setAttribute('data-wf-page', pageId);
      if (window.Webflow) {
        if (window.Webflow.destroy) window.Webflow.destroy();
        if (window.Webflow.ready) window.Webflow.ready();
        if (window.Webflow.require) {
          var ix2 = window.Webflow.require('ix2');
          if (ix2 && ix2.init) ix2.init();
        }
      }
    } catch (e) {}
  }

  function initBarba() {
    if (typeof barba === 'undefined' || typeof gsap === 'undefined' || typeof Flip === 'undefined') {
      setTimeout(initBarba, 50);
      return;
    }
    if (window.__kfilmsBarbaReady) return;
    window.__kfilmsBarbaReady = true;
    gsap.registerPlugin(Flip);
    barba.hooks.beforeLeave(function (data) {
      if (data.current && data.current.namespace === 'home') {
        if (window.kfilmsDestroyHome) window.kfilmsDestroyHome();
        if (window.lenis && window.lenis.stop) try { window.lenis.stop(); } catch (e) {}
      }
    });
    prepareVisuals(document);
    bindPlayCursor(document);
    bindFlipPointer(document);

    barba.hooks.after(function (data) {
      if (data.next && data.next.container) {
        data.next.container.classList.remove('fixed');
      }
      var reverseHome = data.next && data.next.namespace === 'home' &&
        data.current && data.current.namespace === 'theatre';
      var active = document.querySelector('.active-flip-item');
      if (reverseHome && active) {
        try {
          active.scrollIntoView({ block: 'center', behavior: 'auto' });
        } catch (e) {
          window.scrollTo(0, active.getBoundingClientRect().top + window.pageYOffset - window.innerHeight / 3);
        }
        setTimeout(function () {
          document.querySelectorAll('.active-flip-item').forEach(function (el) {
            el.classList.remove('active-flip-item');
          });
        }, 400);
      } else {
        document.querySelectorAll('.active-flip-item').forEach(function (el) {
          el.classList.remove('active-flip-item');
        });
        window.scrollTo(0, 0);
      }
      window.__kfilmsFlipId = null;
      if (!(data.next && data.next.namespace === 'theatre')) {
        try { sessionStorage.removeItem(FLIP_ID_KEY); } catch (e) {}
      }
      resetWebflow(data);
      prepareVisuals(data.next && data.next.container);
      if (data.next && data.next.namespace === 'home') {
        bindPlayCursor(data.next.container);
        bindFlipPointer(data.next.container);
        if (window.kfilmsInitHome) window.kfilmsInitHome(data.next.container);
        if (window.lenis && window.lenis.start) try { window.lenis.start(); } catch (e) {}
      }
    });

    barba.init({
      preventRunning: true,
      transitions: [
        {
          name: 'list-to-theatre',
          sync: true,
          from: {
            namespace: ['home'],
            custom: function (data) {
              var trigger = data.trigger;
              if (!trigger || !trigger.closest || !trigger.closest('.theatre-list')) return false;
              var id = resolveTheatreId(trigger);
              if (!id && trigger.getAttribute) {
                var href = trigger.getAttribute('href') || '';
                var mm = href.match(/#(video-[\w-]+)/);
                if (mm) id = mm[1];
              }
              if (!id && trigger.closest) {
                var media = trigger.closest('.theatre-list [data-theatre-id]');
                if (media) id = media.getAttribute('data-theatre-id');
              }
              return !!id && HASHES.indexOf(id) !== -1;
            }
          },
          to: { namespace: ['theatre'] },
          enter: function (data) {
            var $ = window.jQuery;
            var id = resolveTheatreId(data.trigger) || window.__kfilmsFlipId;
            if (!id && data.next && data.next.url) {
              id = (data.next.url.hash || '').replace(/^#/, '');
            }
            setCursorActive(false);
            if (window.kfilmsDestroyHome) window.kfilmsDestroyHome();
            if (window.lenis && window.lenis.stop) try { window.lenis.stop(); } catch (e) {}
            persistFlipId(id);
            markActive(id);
            data.next.container.classList.add('fixed');
            if (id && window.history && window.history.replaceState) {
              window.history.replaceState(null, '', data.next.url.path + '#' + id);
            }
            prepareVisuals(data.next.container);
            window.kfilmsInitTheatre(data.next.container, id);
            var outgoing = data.current.container.querySelector('.active-flip-item') ||
              document.querySelector('.active-flip-item');
            var incoming = data.next.container.querySelector(
              '.kf-slide-bg[data-theatre-id="' + id + '"]'
            );
            if ($ && outgoing && incoming) {
              flipDom($, $(outgoing), $(incoming));
            }
            return gsap.to(data.current.container, { opacity: 0, duration: 0.5, ease: 'power1.inOut' });
          }
        },
        {
          name: 'theatre-to-list',
          sync: true,
          from: {
            namespace: ['theatre'],
            custom: function (data) {
              return !!resolveLeavingTheatreId(data);
            }
          },
          to: { namespace: ['home'] },
          leave: function () {
            setCursorActive(false);
            // Defer destroyTheatre until after Flip captures the visual
            return Promise.resolve();
          },
          enter: function (data) {
            var $ = window.jQuery;
            var id = resolveLeavingTheatreId(data);
            setCursorActive(false);
            persistFlipId(id);
            prepareVisuals(data.next.container);
            bindPlayCursor(data.next.container);
            bindFlipPointer(data.next.container);
            if (window.kfilmsInitHome) window.kfilmsInitHome(data.next.container);
            var outgoing = data.current.container.querySelector(
              '.kf-slide-bg[data-theatre-id="' + id + '"]'
            );
            if (!outgoing) {
              outgoing = data.current.container.querySelector('.kf-slide-bg.is-active, .swiper-slide-active .kf-slide-bg, .kf-slide-bg');
            }
            var incoming = markActive(id);
            if (!incoming && data.next.container) {
              incoming = data.next.container.querySelector('.theatre-list [data-theatre-id="' + id + '"]');
              if (incoming) incoming.classList.add('active-flip-item');
            }
            data.next.container.classList.add('fixed');
            if ($ && outgoing && incoming) {
              flipDom($, $(outgoing), $(incoming));
            }
            return gsap.to(data.current.container, {
              opacity: 0,
              duration: 0.5,
              ease: 'power1.inOut',
              onComplete: function () { destroyTheatre(); }
            });
          }
        },
        {
          name: 'default-fade',
          leave: function (data) {
            setCursorActive(false);
            destroyTheatre();
            return gsap.to(data.current.container, { opacity: 0, duration: 0.3, ease: 'power2.inOut' });
          },
          enter: function (data) {
            gsap.set(data.next.container, { opacity: 0 });
            var ns = data.next.namespace;
            if (ns === 'theatre') {
              var h = (data.next.url && data.next.url.hash || '').replace(/^#/, '');
              prepareVisuals(data.next.container);
              window.kfilmsInitTheatre(data.next.container, h || null);
              if (h) persistFlipId(h);
            }
            if (ns === 'home') {
              prepareVisuals(data.next.container);
              window.kfilmsBindPlayCursor(data.next.container);
              bindFlipPointer(data.next.container);
              if (window.kfilmsInitHome) window.kfilmsInitHome(data.next.container);
            }
            return gsap.to(data.next.container, { opacity: 1, duration: 0.35, ease: 'power2.out' });
          }
        }
      ],
      views: [
        {
          namespace: 'home',
          afterEnter: function (data) {
            var root = data.next ? data.next.container : document;
            prepareVisuals(root);
            window.kfilmsBindPlayCursor(root);
            bindFlipPointer(root);
            if (window.kfilmsInitHome) window.kfilmsInitHome(root);
            if (window.lenis && window.lenis.start) try { window.lenis.start(); } catch (e) {}
          }
        },
        {
          namespace: 'theatre',
          afterEnter: function (data) {
            var h = (window.location.hash || '').replace(/^#/, '');
            if (!h) h = readStoredFlipId();
            prepareVisuals(data.next ? data.next.container : document);
            window.kfilmsInitTheatre(data.next ? data.next.container : document, h || null);
            if (h) persistFlipId(h);
          }
        }
      ]
    });

    document.addEventListener('mouseover', function (e) {
      var a = e.target.closest && e.target.closest('a[href*="/theatre"]');
      if (a && barba.prefetch) {
        try { barba.prefetch(a.href.split('#')[0]); } catch (err) {}
      }
    }, true);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initBarba);
  else initBarba();
})();
</script>
