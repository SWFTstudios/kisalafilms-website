<script>
(function () {
  if (window.__kfilmsSiteHeaderReady) return;
  window.__kfilmsSiteHeaderReady = true;
  var THEME_KEY = 'kfilms-theme';
  var FORMAT_KEY = 'kfilms-time-format';
  function getStoredTheme() {
    try {
      var t = localStorage.getItem(THEME_KEY);
      if (t === 'day' || t === 'night') return t;
    } catch (e) {}
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'day';
    return 'night';
  }
  function applyTheme(theme) {
    document.documentElement.classList.remove('theme-day', 'theme-night');
    document.documentElement.classList.add(theme === 'day' ? 'theme-day' : 'theme-night');
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    var btn = document.querySelector('.site-menu-theme');
    if (btn) btn.textContent = theme === 'day' ? 'Switch to Night' : 'Switch to Day';
  }
  function getFormat() {
    try {
      var f = localStorage.getItem(FORMAT_KEY);
      if (f === '12' || f === '24') return f;
    } catch (e) {}
    return '12';
  }
  function setFormat(fmt) {
    try { localStorage.setItem(FORMAT_KEY, fmt); } catch (e) {}
  }
  function formatTime(date, fmt) {
    var h = date.getHours();
    var m = date.getMinutes();
    var s = date.getSeconds();
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    if (fmt === '24') return pad(h) + ':' + pad(m) + ':' + pad(s);
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12;
    if (h12 === 0) h12 = 12;
    return h12 + ':' + pad(m) + ':' + pad(s) + ' ' + ampm;
  }
  function ensureOverlay() {
    var overlay = document.querySelector('.site-menu-overlay');
    if (overlay) return overlay;
    overlay = document.createElement('div');
    overlay.className = 'site-menu-overlay';
    overlay.setAttribute('aria-hidden', 'true');
    overlay.innerHTML =
      '<nav aria-label="Site">' +
        '<ul class="site-menu-nav">' +
          '<li><a href="/">Home</a></li>' +
          '<li><a href="/#theatre-grid">Theatre</a></li>' +
          '<li><a href="/styleguide">Styleguide</a></li>' +
          '<li><a href="/about">About</a></li>' +
        '</ul>' +
      '</nav>' +
      '<button type="button" class="site-menu-theme">Switch to Day</button>';
    document.body.appendChild(overlay);
    return overlay;
  }
  function setMenuOpen(open) {
    var header = document.querySelector('.site-header');
    var overlay = ensureOverlay();
    if (header) header.classList.toggle('is-open', open);
    overlay.classList.toggle('is-open', open);
    overlay.setAttribute('aria-hidden', open ? 'false' : 'true');
    document.body.classList.toggle('menu-open', open);
    var menuBtn = document.querySelector('.site-header_menu');
    if (menuBtn) menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  function initHeader(header) {
    if (header.getAttribute('data-site-header-ready')) return;
    header.setAttribute('data-site-header-ready', '1');
    var clock = header.querySelector('.site-clock');
    var menuBtn = header.querySelector('.site-header_menu');
    var overlay = ensureOverlay();
    var fmt = getFormat();
    function tick() {
      if (clock) {
        var textNode = clock.childNodes[0];
        var label = formatTime(new Date(), fmt);
        if (textNode && textNode.nodeType === 3) textNode.textContent = label;
        else clock.textContent = label;
      }
    }
    tick();
    setInterval(tick, 1000);
    if (clock) {
      clock.setAttribute('aria-label', 'Toggle 12 or 24 hour time');
      clock.setAttribute('role', 'button');
      clock.addEventListener('click', function (e) {
        e.preventDefault();
        fmt = fmt === '12' ? '24' : '12';
        setFormat(fmt);
        tick();
      });
    }
    if (menuBtn) {
      menuBtn.setAttribute('aria-expanded', 'false');
      menuBtn.setAttribute('aria-controls', 'site-menu-overlay');
      menuBtn.setAttribute('aria-label', 'Open menu');
      menuBtn.setAttribute('role', 'button');
      menuBtn.addEventListener('click', function (e) {
        e.preventDefault();
        var open = !document.body.classList.contains('menu-open');
        setMenuOpen(open);
        menuBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      });
    }
    overlay.id = 'site-menu-overlay';
    var themeBtn = overlay.querySelector('.site-menu-theme');
    if (themeBtn && !themeBtn.getAttribute('data-bound')) {
      themeBtn.setAttribute('data-bound', '1');
      themeBtn.addEventListener('click', function () {
        var next = document.documentElement.classList.contains('theme-day') ? 'night' : 'day';
        applyTheme(next);
      });
    }
    overlay.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function () { setMenuOpen(false); });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') setMenuOpen(false);
    });
  }
  applyTheme(getStoredTheme());
  function boot() {
    document.querySelectorAll('.site-header').forEach(initHeader);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
(function () {
  if (window.__kfilmsHomeScrollReady) return;
  window.__kfilmsHomeScrollReady = true;

  var homeMm = null;
  var marqueeTween = null;
  var marqueeBoostHandler = null;

  function ensurePlugins() {
    if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return false;
    gsap.registerPlugin(ScrollTrigger);
    return true;
  }

  function ensureLenis() {
    if (!ensurePlugins()) return null;
    if (typeof Lenis === 'undefined') return null;
    if (!window.lenis) {
      var lenis = new Lenis({ lerp: 0.1, smoothWheel: true });
      lenis.on('scroll', ScrollTrigger.update);
      gsap.ticker.add(function (time) {
        lenis.raf(time * 1000);
      });
      gsap.ticker.lagSmoothing(0);
      window.lenis = lenis;
    }
    return window.lenis;
  }

  function scopeRoot(root) {
    if (root && root.querySelector) return root;
    return document.querySelector('[data-barba="container"]') || document;
  }

  function hasHomeMarkers(scope) {
    return !!(
      scope.querySelector('.horizontal') ||
      scope.querySelector('.marquee-track') ||
      scope.querySelector('.theatre-pin') ||
      scope.querySelector('.about-intro-media') ||
      scope.querySelector('.theatre-list, [data-theatre-grid]')
    );
  }

  window.kfilmsDestroyHome = function () {
    if (homeMm && homeMm.revert) {
      try { homeMm.revert(); } catch (e) {}
    }
    homeMm = null;
    if (marqueeTween) {
      try { marqueeTween.kill(); } catch (e) {}
      marqueeTween = null;
    }
    if (marqueeBoostHandler && window.lenis && typeof window.lenis.off === 'function') {
      try { window.lenis.off('scroll', marqueeBoostHandler); } catch (e) {}
      marqueeBoostHandler = null;
    }
    if (typeof ScrollTrigger === 'undefined') return;
    ScrollTrigger.getAll().forEach(function (st) {
      var t = st.trigger;
      if (!t) {
        st.kill();
        return;
      }
      if (
        t.closest &&
        (t.closest('.horizontal') ||
          t.closest('.about-intro-media') ||
          t.closest('.theatre-pin') ||
          t.closest('.theatre-list, [data-theatre-grid]') ||
          t.closest('.marquee-section'))
      ) {
        st.kill();
      }
    });
    var clearRoot = document.querySelector('[data-barba="container"]') || document;
    gsap.set(
      clearRoot.querySelectorAll(
        '.theatre-dept-label, .theatre-dept-links, .theatre-dept-desc, .theatre-dept-media, .theatre-dept-line, .theatre-list-intro > *'
      ),
      { clearProps: 'opacity,transform,translate' }
    );
  };

  function initAboutWipe(scope) {
    var media = scope.querySelector('.about-intro-media');
    var image = scope.querySelector('.about-image-placeholder');
    if (!media || !image) return;
    gsap.fromTo(
      image,
      { clipPath: 'inset(0 100% 0 0)' },
      {
        clipPath: 'inset(0 0% 0 0)',
        ease: 'none',
        scrollTrigger: {
          trigger: media,
          start: 'top 80%',
          end: 'top 30%',
          scrub: true,
        },
      }
    );
  }

  function initMarquee(scope, lenis) {
    var track = scope.querySelector('.marquee-track');
    if (!track) return;

    if (!track.getAttribute('data-kf-marquee-ready')) {
      var originals = Array.prototype.slice.call(track.children);
      originals.forEach(function (child) {
        track.appendChild(child.cloneNode(true));
      });
      track.setAttribute('data-kf-marquee-ready', '1');
    }

    marqueeTween = gsap.to(track, {
      x: function () {
        return -track.scrollWidth / 2;
      },
      duration: 45,
      ease: 'none',
      repeat: -1,
    });

    var idleTimer;
    function boostFromVelocity(velocity) {
      var boost = Math.min(Math.abs(velocity) / 600, 3);
      var target = 1 + boost;
      gsap.to(marqueeTween, {
        timeScale: target,
        duration: 0.35,
        overwrite: true,
        ease: 'power2.out',
      });
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () {
        gsap.to(marqueeTween, {
          timeScale: 1,
          duration: 0.8,
          overwrite: true,
          ease: 'power2.out',
        });
      }, 120);
    }

    if (lenis) {
      marqueeBoostHandler = function (e) {
        boostFromVelocity(e.velocity || 0);
      };
      lenis.on('scroll', marqueeBoostHandler);
    } else {
      ScrollTrigger.create({
        onUpdate: function (self) {
          boostFromVelocity(self.getVelocity());
        },
      });
    }
  }

  function initTheatrePin(scope) {
    var pin = scope.querySelector('.theatre-pin');
    var reel = scope.querySelector('.theatre-reel');
    if (!pin || !reel) return;

    function getStartSize() {
      var vw = window.innerWidth;
      return vw < 768 ? vw * 0.55 : vw * 0.4;
    }

    gsap.fromTo(
      reel,
      {
        width: function () {
          return getStartSize();
        },
        height: function () {
          return getStartSize();
        },
        aspectRatio: '1 / 1',
      },
      {
        width: function () {
          return window.innerWidth;
        },
        height: function () {
          return window.innerHeight;
        },
        aspectRatio: 'auto',
        ease: 'none',
        scrollTrigger: {
          trigger: pin,
          start: 'top top',
          end: 'bottom bottom',
          scrub: true,
          invalidateOnRefresh: true,
        },
      }
    );
  }

  function initTheatreList(scope) {
    var depts = gsap.utils.toArray(scope.querySelectorAll('.theatre-dept'));
    if (!depts.length) return;

    var intro = scope.querySelector('.theatre-list-intro');
    if (intro) {
      gsap.from(intro.children, {
        opacity: 0,
        y: 24,
        duration: 0.8,
        stagger: 0.1,
        ease: 'power2.out',
        immediateRender: false,
        scrollTrigger: {
          trigger: intro,
          start: 'top 80%',
          toggleActions: 'play none none none',
        },
      });
    }

    depts.forEach(function (dept) {
      var line = dept.querySelector('.theatre-dept-line');
      var label = dept.querySelector('.theatre-dept-label');
      var links = dept.querySelector('.theatre-dept-links');
      var desc = dept.querySelector('.theatre-dept-desc');
      var media = dept.querySelector('.theatre-dept-media');

      if (line) {
        gsap.fromTo(
          line,
          { scaleX: 0 },
          {
            scaleX: 1,
            ease: 'power2.out',
            duration: 1,
            immediateRender: false,
            scrollTrigger: {
              trigger: dept,
              start: 'top 75%',
              toggleActions: 'play none none none',
            },
          }
        );
      }

      var fadeItems = [label, links, desc, media].filter(Boolean);
      if (fadeItems.length) {
        gsap.from(fadeItems, {
          opacity: 0,
          y: 28,
          duration: 0.75,
          stagger: 0.12,
          ease: 'power2.out',
          immediateRender: false,
          scrollTrigger: {
            trigger: dept,
            start: 'top 75%',
            toggleActions: 'play none none none',
          },
        });
      }
    });
  }

  function initHorizontal(scope) {
    homeMm = gsap.matchMedia();
    homeMm.add('(min-width: 769px)', function () {
      var horizontal = scope.querySelector('.horizontal');
      if (!horizontal) return;

      var horizontalContent = horizontal.querySelector('.horizontal_wrapper');
      if (!horizontalContent) return;

      var tl = gsap.timeline({
        defaults: { ease: 'none' },
        scrollTrigger: {
          trigger: horizontal,
          start: 'top top',
          end: function () {
            return '+=' + (horizontalContent.scrollWidth - window.innerWidth);
          },
          pin: true,
          scrub: 1,
          invalidateOnRefresh: true,
        },
      });

      tl.to(horizontalContent, {
        x: function () {
          return -(horizontalContent.scrollWidth - window.innerWidth);
        },
        ease: 'none',
      });

      var wallPieces = gsap.utils.toArray(scope.querySelectorAll('[class*="wall-piece-"]'));
      var pieceTriggers = [];

      wallPieces.forEach(function (piece) {
        var anim = gsap.fromTo(
          piece,
          { scale: 0.35 },
          {
            scale: 1,
            duration: 0.9,
            ease: 'power2.out',
            scrollTrigger: {
              trigger: piece,
              containerAnimation: tl,
              start: 'left 85%',
              toggleActions: 'play none none none',
            },
          }
        );
        if (anim.scrollTrigger) pieceTriggers.push(anim.scrollTrigger);
      });

      return function () {
        pieceTriggers.forEach(function (st) {
          st.kill();
        });
        if (tl.scrollTrigger) tl.scrollTrigger.kill();
        tl.kill();
        gsap.set(horizontalContent, { clearProps: 'x' });
        gsap.set(wallPieces, { clearProps: 'scale' });
      };
    });
  }

  window.kfilmsInitHome = function (root) {
    if (!ensurePlugins()) return;
    var scope = scopeRoot(root);
    if (!hasHomeMarkers(scope)) return;

    window.kfilmsDestroyHome();
    var lenis = ensureLenis();
    if (lenis && lenis.start) {
      try { lenis.start(); } catch (e) {}
    }

    initAboutWipe(scope);
    initMarquee(scope, lenis);
    initHorizontal(scope);
    initTheatrePin(scope);
    initTheatreList(scope);

    requestAnimationFrame(function () {
      if (typeof ScrollTrigger !== 'undefined') ScrollTrigger.refresh(true);
    });
  };

  function boot() {
    var container = document.querySelector('[data-barba-namespace="grid-page"]') ||
      document.querySelector('[data-barba-namespace="home"]') ||
      document.querySelector('[data-barba="container"]');
    if (container && hasHomeMarkers(container)) {
      window.kfilmsInitHome(container);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>

<script src="https://unpkg.com/@barba/core@2.9.7/dist/barba.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>
<script>
(function () {
  if (window.__kfilmsFlip20Ready) return;
  window.__kfilmsFlip20Ready = true;

  var mySlider = null;

  function ensureLibs() {
    var ok = typeof barba !== 'undefined' && typeof gsap !== 'undefined' && typeof Flip !== 'undefined';
    if (ok && gsap.registerPlugin) {
      try { gsap.registerPlugin(Flip); if (typeof ScrollTrigger !== 'undefined') gsap.registerPlugin(ScrollTrigger); } catch (e) {}
    }
    return ok;
  }

  function flipItems() {
    return Array.prototype.slice.call(document.querySelectorAll('.theatre-dept, .swiper-slide.is-list, .w-dyn-item'));
  }

  function scrollToActiveFlipItem() {
    var active = document.querySelector('.active-flip-item');
    if (!active) return;
    try {
      active.scrollIntoView({ block: 'center', behavior: 'auto' });
    } catch (e) {
      try {
        var top = active.getBoundingClientRect().top + (window.pageYOffset || 0) - window.innerHeight * 0.2;
        window.scrollTo(0, Math.max(0, top));
      } catch (e2) {}
    }
    if (window.lenis && typeof window.lenis.scrollTo === 'function') {
      try { window.lenis.scrollTo(active, { immediate: true, offset: -80 }); } catch (e3) {}
    }
  }

  function createSwiper() {
    if (typeof Swiper === 'undefined') return null;
    var el = document.querySelector('[data-theatre-grid] .swiper, .kf-flip-grid .swiper');
    if (!el) return null;
    if (mySlider && mySlider.destroy) {
      try { mySlider.destroy(true, true); } catch (e) {}
      mySlider = null;
    }
    mySlider = new Swiper(el, {
      direction: 'horizontal',
      slidesPerView: 1,
      keyboard: true,
      freeMode: true,
      centeredSlides: true,
      mousewheel: true,
      breakpoints: {
        480: { slidesPerView: 2 },
        768: { slidesPerView: 3 }
      },
      speed: 300
    });
    mySlider.on('progress', function (e) {
      var fill = document.querySelector('.progress-bar_fill');
      if (fill) fill.style.width = (e.progress * 100) + '%';
    });
    return mySlider;
  }

  function resetWebflow(data) {
    try {
      var parser = new DOMParser();
      var dom = parser.parseFromString(data.next.html, 'text/html');
      var webflowPageId = dom.documentElement.getAttribute('data-wf-page');
      if (webflowPageId) document.documentElement.setAttribute('data-wf-page', webflowPageId);
      if (window.Webflow) {
        if (window.Webflow.destroy) window.Webflow.destroy();
        if (window.Webflow.ready) window.Webflow.ready();
        if (window.Webflow.require) {
          var ix2 = window.Webflow.require('ix2');
          if (ix2 && ix2.init) ix2.init();
        }
      }
    } catch (e) {}
  }

  function makeItemActive() {
    var cms = document.querySelector('.cms-page');
    if (!cms) return;
    var nameEl = cms.querySelector('.item-name');
    var cmsPageName = nameEl ? (nameEl.textContent || '').trim() : '';
    flipItems().forEach(function (item) {
      item.classList.remove('active-flip-item');
      var n = item.querySelector('.item-name');
      if (n && (n.textContent || '').trim() === cmsPageName) {
        item.classList.add('active-flip-item');
      }
    });
  }

  function flip(outgoing, incoming) {
    if (!outgoing || !incoming || typeof Flip === 'undefined') return;
    var visual = outgoing.querySelector('.visual');
    if (!visual) return;
    var state = Flip.getState(visual);
    var incomingVisual = incoming.querySelector('.visual');
    if (incomingVisual) incomingVisual.remove();
    incoming.appendChild(visual);
    Flip.from(state, { duration: 0.5, ease: 'power1.inOut' });
  }

  function destroyCmsHorizontal() {
    if (window.__kfilmsCmsSt) {
      try { window.__kfilmsCmsSt.kill(); } catch (e) {}
      window.__kfilmsCmsSt = null;
    }
  }

  function initCmsHorizontal(root) {
    destroyCmsHorizontal();
    if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;
    var scope = root || document;
    var height = scope.querySelector('.section-height');
    var track = scope.querySelector('.track-flex') || scope.querySelector('.track');
    if (!height || !track) return;
    gsap.registerPlugin(ScrollTrigger);
    var tween = gsap.to(track, {
      x: function () { return -(track.scrollWidth - window.innerWidth); },
      ease: 'none',
      scrollTrigger: {
        trigger: height,
        start: 'top top',
        end: function () { return '+=' + Math.max(window.innerHeight, track.scrollWidth); },
        scrub: 1,
        pin: scope.querySelector('.sticky-element') || true,
        invalidateOnRefresh: true
      }
    });
    window.__kfilmsCmsSt = tween.scrollTrigger;
  }

  window.kfilmsInitCmsPage = function (root) {
    initCmsHorizontal(root);
  };

  function onEnterGrid(data) {
    createSwiper();
    var active = document.querySelector('.active-flip-item');
    if (mySlider && active) {
      var slides = Array.prototype.slice.call(document.querySelectorAll('.swiper-slide.is-list'));
      var idx = slides.indexOf(active);
      if (idx >= 0) mySlider.slideTo(idx, 0);
    } else {
      scrollToActiveFlipItem();
    }
    if (typeof window.kfilmsInitHome === 'function') {
      window.kfilmsInitHome(data.next.container);
    }
  }

  function bootBarba() {
    if (!ensureLibs()) return false;
    if (window.__kfilmsBarbaInited) {
      createSwiper();
      return true;
    }
    window.__kfilmsBarbaInited = true;

      function nsOf(container, fallback) {
    if (!container) return fallback || '';
    var attr = container.getAttribute('data-barba-namespace');
    if (attr) return attr;
    if (container.classList.contains('cms-page') || container.querySelector('.cms-page')) return 'cms-page';
    if (container.classList.contains('kf-flip-grid') || container.classList.contains('kf-flip-stack') || container.querySelector('[data-theatre-grid], .kf-flip-grid, .kf-flip-stack')) return 'grid-page';
    if (container.querySelector('.theatre-list, .hero-section, .horizontal')) return 'grid-page';
    return fallback || '';
  }

    
    barba.hooks.after(function (data) {
      if (data.next && data.next.container) {
        data.next.container.classList.remove('fixed');
      }
      document.querySelectorAll('.active-flip-item').forEach(function (el) {
        el.classList.remove('active-flip-item');
      });
      window.scrollTo(0, 0);
      resetWebflow(data);
      var ns = data.next ? nsOf(data.next.container, data.next.namespace) : '';
      if (ns === 'grid-page') {
        requestAnimationFrame(function () {
          onEnterGrid(data);
          if (typeof ScrollTrigger !== 'undefined') ScrollTrigger.refresh(true);
        });
      } else if (ns === 'cms-page') {
        requestAnimationFrame(function () {
          window.kfilmsInitCmsPage(data.next.container);
        });
      }
    });

    barba.hooks.beforeLeave(function (data) {
      if (data.current && nsOf(data.current.container, data.current.namespace) === 'grid-page') {
        if (typeof window.kfilmsDestroyHome === 'function') window.kfilmsDestroyHome();
      }
      if (data.current && nsOf(data.current.container, data.current.namespace) === 'cms-page') {
        destroyCmsHorizontal();
      }
    });

    barba.init({
      preventRunning: true,
      transitions: [
        {
          name: 'grid-to-cms',
          sync: true,
          from: { custom: function (data) { return nsOf(data.current.container, data.current.namespace) === 'grid-page'; } },
          to: { custom: function (data) { return nsOf(data.next.container, data.next.namespace) === 'cms-page'; } },
          enter: function (data) {
            makeItemActive();
            data.next.container.classList.add('fixed');
            var active = document.querySelector('.active-flip-item');
            var wrap = data.next.container.querySelector('.cms-page_img-wrap');
            if (active && wrap) flip(active, wrap);
            return gsap.to(data.current.container, { opacity: 0, duration: 0.5 });
          }
        },
        {
          name: 'cms-to-grid',
          sync: true,
          from: { custom: function (data) { return nsOf(data.current.container, data.current.namespace) === 'cms-page'; } },
          to: { custom: function (data) { return nsOf(data.next.container, data.next.namespace) === 'grid-page'; } },
          enter: function (data) {
            makeItemActive();
            createSwiper();
            var active = document.querySelector('.active-flip-item');
            if (mySlider && active) {
              var slides = Array.prototype.slice.call(document.querySelectorAll('.swiper-slide.is-list'));
              var idx = slides.indexOf(active);
              if (idx >= 0) mySlider.slideTo(idx, 0);
            } else {
              scrollToActiveFlipItem();
            }
            data.next.container.classList.add('fixed');
            var wrap = data.current.container.querySelector('.cms-page_img-wrap');
            var dest = active ? active.querySelector('.visual_wrap') : null;
            if (wrap && dest) flip(wrap, dest);
            return gsap.to(data.current.container, { opacity: 0, duration: 0.5 });
          }
        },
        {
          name: 'default',
          leave: function (data) {
            return gsap.to(data.current.container, { opacity: 0, duration: 0.25 });
          },
          enter: function (data) {
            gsap.fromTo(data.next.container, { opacity: 0 }, { opacity: 1, duration: 0.25 });
          }
        }
      ]
    });

    createSwiper();
    if (document.querySelector('.cms-page')) {
      window.kfilmsInitCmsPage(document.querySelector('[data-barba="container"]') || document);
    }
    return true;
  }

  function tryBoot() {
    var tries = 0;
    function attempt() {
      tries += 1;
      if (bootBarba()) return;
      if (tries < 50) setTimeout(attempt, 100);
    }
    attempt();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tryBoot);
  else tryBoot();
})();
</script>
